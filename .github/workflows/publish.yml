name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_ref:
        description: "Existing tag to publish, for example v0.6.6"
        required: true
        type: string
      recover_existing:
        description: "Skip PyPI upload and recover verification/GitHub Release for an already published tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  prepare-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Guard release sequence
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recover_existing) }}
        shell: bash
        run: |
          TAG="${{ inputs.publish_ref || github.ref_name }}"
          python scripts/check_release_publish_guard.py --tag "$TAG" --package grados --repo "$GITHUB_WORKSPACE"

      - name: Generate GitHub Release notes
        shell: bash
        run: |
          TAG="${{ inputs.publish_ref || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          python scripts/release.py "$VERSION" --print-release-notes > release-notes.md

      - name: Upload GitHub Release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  verify-release:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recover_existing) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publish_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project and dev dependencies
        run: uv sync --group dev

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Run mypy
        run: uv run mypy src

      - name: Run Python smoke tests
        run: uv run pytest tests -q

      - name: Build sdist and wheel
        run: uv build --native-tls --no-sources

      - name: Smoke-test local wheel via uvx and uv tool install
        shell: bash
        run: |
          WHEEL="$(ls dist/grados-*.whl | head -n1)"
          export XDG_DATA_HOME=/tmp/grados-xdg
          export UV_CACHE_DIR=/tmp/grados-uv-cache
          uvx --python ./.venv/bin/python --from "$WHEEL" grados version
          uv tool install --python ./.venv/bin/python "$WHEEL" --force
          BIN_DIR="$(uv tool dir --bin)"
          "$BIN_DIR/grados" version

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs:
      - prepare-release-notes
      - verify-release
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recover_existing) }}
    environment:
      name: pypi
      url: https://pypi.org/p/grados
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          verbose: true

  verify-pypi:
    runs-on: ubuntu-latest
    needs:
      - prepare-release-notes
      - verify-release
      - publish
    if: >-
      ${{
        always()
        && needs.prepare-release-notes.result == 'success'
        && (
          (
            !(github.event_name == 'workflow_dispatch' && inputs.recover_existing)
            && needs.verify-release.result == 'success'
            && needs.publish.result == 'success'
          )
          || (
            github.event_name == 'workflow_dispatch'
            && inputs.recover_existing
            && needs.verify-release.result == 'skipped'
            && needs.publish.result == 'skipped'
          )
        )
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publish_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify uv tool install and uvx from PyPI with retries
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.publish_ref || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          export VERSION UV_CACHE_DIR=/tmp/grados-uv-cache
          mkdir -p "$UV_CACHE_DIR"

          diagnose_pypi() {
            if curl -fsS https://pypi.org/pypi/grados/json > /tmp/grados-pypi.json; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          data = json.loads(Path("/tmp/grados-pypi.json").read_text(encoding="utf-8"))
          files = data.get("releases", {}).get(version, [])
          print(f"PyPI latest: {data.get('info', {}).get('version')}")
          print(f"grados {version} file count: {len(files)}")
          for file in files:
              print(f"- {file.get('filename')} uploaded {file.get('upload_time_iso_8601')}")
          PY
            else
              echo "Could not fetch PyPI JSON diagnostics for grados ${VERSION}."
            fi
          }

          for attempt in $(seq 1 30); do
            echo "PyPI install smoke attempt ${attempt}/30 for grados ${VERSION}"
            export XDG_DATA_HOME="/tmp/grados-xdg-${attempt}"
            rm -rf "$XDG_DATA_HOME"
            mkdir -p "$XDG_DATA_HOME"

            if uv tool install --refresh-package grados "grados==${VERSION}" --force \
              > /tmp/grados-tool-install.log 2>&1; then
              BIN_DIR="$(uv tool dir --bin)"
              if "$BIN_DIR/grados" version > /tmp/grados-tool-version.txt 2>&1 \
                && grep -Fx "GRaDOS ${VERSION}" /tmp/grados-tool-version.txt \
                && uvx --no-cache --refresh-package grados --from "grados==${VERSION}" grados version \
                  > /tmp/grados-uvx-version.txt 2>&1 \
                && grep -Fx "GRaDOS ${VERSION}" /tmp/grados-uvx-version.txt; then
                exit 0
              fi
            fi

            echo "::group::Failed install attempt ${attempt}"
            tail -n 80 /tmp/grados-tool-install.log || true
            cat /tmp/grados-tool-version.txt 2>/dev/null || true
            cat /tmp/grados-uvx-version.txt 2>/dev/null || true
            echo "::endgroup::"

            if [ "$attempt" != "30" ]; then
              sleep 10
            fi
          done

          echo "::group::PyPI release diagnostics"
          diagnose_pypi
          echo "::endgroup::"
          echo "Timed out waiting for installable grados ${VERSION} from PyPI"
          exit 1

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - prepare-release-notes
      - verify-pypi
    permissions:
      contents: write

    steps:
      - name: Download GitHub Release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.publish_ref || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
